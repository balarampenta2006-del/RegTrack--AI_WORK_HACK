name: ai-hack

services:
  mysql:
    image: mysql:8.4
    container_name: regtrack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: regtrack
      MYSQL_USER: regtrack
      MYSQL_PASSWORD: regtrack
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: regtrack-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/regtrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: regtrack
      DB_PASSWORD: regtrack
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-shared-secret-please-change}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@regtrack.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      EXTRACTION_WORKER_URL: http://extraction-worker:8000
    ports:
      - "8080:8080"

  # ── Phase 2: Extraction Worker (BeautifulSoup + Firecrawl) ──────────
  extraction-worker:
    build: ./extraction-worker
    container_name: regtrack-extraction-worker
    environment:
      EXTRACT_FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      EXTRACT_FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev}
      EXTRACT_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Phase 2: ChangeDetection.io (Website Monitoring) ────────────────
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    container_name: regtrack-changedetection
    environment:
      BASE_URL: ${CHANGEDETECTION_BASE_URL:-http://localhost:5000}
      PLAYWRIGHT_DRIVER_URL: ws://playwright-chrome:3000/?stealth=1&--disable-web-security=true
    ports:
      - "5000:5000"
    volumes:
      - changedetection-data:/datastore
    depends_on:
      - playwright-chrome
    restart: unless-stopped

  # ── Headless browser for ChangeDetection.io ─────────────────────────
  playwright-chrome:
    image: browserless/chrome:latest
    container_name: regtrack-playwright
    environment:
      DEFAULT_LAUNCH_ARGS: '["--no-sandbox","--disable-dev-shm-usage"]'
      CONNECTION_TIMEOUT: 300000
      PREBOOT_CHROME: "true"
      MAX_CONCURRENT_SESSIONS: 4
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ── Phase 2: change-detection service (PLAN §2.5, port 8101) ────────
  monitor:
    build: ./services/monitor
    container_name: regtrack-monitor
    environment:
      API_BASE: http://backend:8080
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-shared-secret-please-change}
      MONITOR_STORAGE_DIR: /data/snapshots
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    ports:
      - "8101:8101"
    volumes:
      # PLAN §2.3 layout on the host: storage/snapshots/<source-code>/
      - ./storage/snapshots:/data/snapshots
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # ── Phase 3: document processing service (PLAN §2.5, port 8102) ─────
  docproc:
    build: ./services/docproc
    container_name: regtrack-docproc
    environment:
      DOCPROC_PORT: "8102"
      STORAGE_ROOT: /data/storage
    ports:
      - "8102:8102"
    volumes:
      # PLAN §2.3 layout on the host: storage/raw, storage/processed/<regId>/v<n>.txt
      - ./storage:/data/storage
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      # docproc Dockerfile ships no HEALTHCHECK; /health exists (docproc/api.py)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Phase 4: AI analysis service (PLAN §2.5, port 8103) ─────────────
  ai:
    build: ./services/ai
    container_name: regtrack-ai
    environment:
      API_BASE: http://backend:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@regtrack.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      STORAGE_ROOT: /storage
      CHROMA_DIR: /storage/chroma
      # LLM keys: unset/empty => stub mode (PLAN §2.1)
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8103:8103"
    volumes:
      # PLAN §2.3 layout on the host: storage/processed, storage/analysis, storage/chroma
      - ./storage:/storage
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # ── Phase 5: n8n workflow automation (PLAN §2.2, port 5678) ─────────
  # n8n-import: one-shot worker that seeds the workflow into the n8n DB
  # (the n8n image's entrypoint IS the n8n CLI, so a shell override is
  # required to run import before start).
  n8n-import:
    image: n8nio/n8n:latest
    container_name: regtrack-n8n-import
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        n8n import:workflow --input=/workflows/regulatory-pipeline.json \
          && touch /home/node/.n8n/.workflow-imported \
          && echo "WORKFLOW_IMPORTED"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-only-n8n-encryption-key-change-me}
      GENERIC_TIMEZONE: ${TZ:-UTC}

  n8n:
    image: n8nio/n8n:latest
    container_name: regtrack-n8n
    depends_on:
      backend:
        condition: service_started
      monitor:
        condition: service_healthy
      docproc:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      # workflow nodes read $env.ADMIN_EMAIL / $env.ADMIN_PASSWORD
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-only-n8n-encryption-key-change-me}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@regtrack.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      API_BASE: http://backend:8080
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-shared-secret-please-change}
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      # workflow auto-import on first start (guarded by marker file in n8n-data)
      - ./n8n/workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5678/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Phase 6/7: React dashboard behind nginx (PLAN §2.2, port 5173) ──
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    container_name: regtrack-frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      # VITE_API_BASE is inlined at build time; the ARG above controls it.
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    ports:
      # host 5173 -> container 80 (nginx). 3000 is taken by playwright-chrome.
      - "5173:80"
    restart: unless-stopped

volumes:
  mysql-data:
  changedetection-data:
  n8n-data:
