spring:
  application:
    name: regtrack-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/regtrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USER:regtrack}
    password: ${DB_PASSWORD:regtrack}
    hikari:
      maximum-pool-size: 10
      pool-name: regtrack-pool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

regtrack:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-me-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
      issuer: regtrack-backend
    webhook:
      secret: ${WEBHOOK_SECRET:dev-webhook-shared-secret-please-change}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-email: ${ADMIN_EMAIL:admin@regtrack.local}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
    admin-name: ${ADMIN_NAME:Platform Admin}

logging:
  level:
    com.regtrack.backend: INFO
    org.flywaydb: INFO
